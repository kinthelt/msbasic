# 816os: BASIC as a process image, linked at $0000 of its bank. The kernel
# starts it at $0000. Load it into a free bank (1-7) with the shell's
# "load <bank>0000" and start it with "run <bank>".
#
# $0000-$00FE  entry code (HEADER), then BASIC's variables (BANKVARS)
# $00FF-$01FF  number output buffer (from STACK2-1), end of the input buffer
# $0200-$02FF  input buffer (INPUTBUFFER)
# $0300-       BASIC, then the program text (RAMSTART2) up to RAMTOP
#
# ZP is the process's direct page, in bank 0. BANK0 only places the STACK
# label at $00:0000 (defines_os816.s).
MEMORY {
	ZP:		start = $0000, size = $0100, type = rw;
	BASIC:		start = $0000, size = $E000, type = rw, file = %O;
	BANK0:		start = $000000, size = $0100, type = rw, file = "";
	DUMMY:		start = $0000, size = $00FF, file = "";
}

SEGMENTS {
	ZEROPAGE:	load = ZP, type = zp;
	HEADER:		load = BASIC,	type = ro;
	BANKVARS:	load = BASIC,	type = rw;	# zeros in the file keep later code in place
	VECTORS:	load = BASIC,	type = ro, start = $0300;
	KEYWORDS:	load = BASIC,	type = ro;
	ERROR:		load = BASIC,	type = ro;
	CODE:		load = BASIC,	type = ro;
	CHRGET:		load = BASIC,	type = ro;
	INIT:		load = BASIC,	type = ro;
	EXTRA:		load = BASIC,	type = ro;
	BANK0:		load = BANK0,	type = bss;
	DUMMY:		load = DUMMY; # don't include
}
